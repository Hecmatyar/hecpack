<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hecpack preview</title>
<style>
:root {
  --bg: #f7f6f3; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6a66; --line: #e4e2dc;
  --accent: #3b5bdb; --accent-soft: #e7ecfd; --add: #e6f4ea; --add-text: #1e6b34; --del: #fbe9e7; --del-text: #a12a1b;
  --warn: #fff4d6; --warn-text: #7a5600; --chip: #f0efeb; --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161615; --panel: #1f1f1d; --text: #ecebe7; --muted: #9c9a94; --line: #33322f;
    --accent: #8ea6ff; --accent-soft: #263055; --add: #17301f; --add-text: #8fd8a5; --del: #3a1d19; --del-text: #f2a497;
    --warn: #3a3015; --warn-text: #f0d48a; --chip: #2a2a27;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
main { max-width: 1080px; margin: 0 auto; padding: 32px 16px 80px; }
header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 24px; }
h1 { font-size: 26px; margin: 0; letter-spacing: -0.01em; }
h1 small { color: var(--muted); font-weight: 400; font-size: 15px; margin-left: 8px; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 0 0 12px; }
.sub { color: var(--muted); margin-top: 4px; }
section { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
.levels { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--panel); }
.levels button { border: 0; background: none; color: var(--text); padding: 8px 16px; font: inherit; cursor: pointer; }
.levels button + button { border-left: 1px solid var(--line); }
.levels button.on { background: var(--accent); color: #fff; }
.levelinfo { color: var(--muted); margin: 0 0 12px; }
.warn { background: var(--warn); color: var(--warn-text); border-radius: 8px; padding: 10px 12px; margin: 0 0 8px; }
table { width: 100%; border-collapse: collapse; }
td, th { text-align: left; vertical-align: top; padding: 10px 8px; border-top: 1px solid var(--line); }
th { font-size: 12px; color: var(--muted); font-weight: 500; border-top: 0; }
.tech { font-weight: 600; white-space: nowrap; }
.ver, .kind, .evidence { color: var(--muted); font-size: 13px; }
.evidence { font-family: var(--mono); font-size: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; background: var(--chip); border-radius: 999px; padding: 2px 10px; font-size: 13px; white-space: nowrap; }
.chip.pack { background: var(--accent-soft); }
.chip input { margin: 0; }
.tag { font-size: 11px; color: var(--muted); }
.off { opacity: 0.45; }
.file { border-top: 1px solid var(--line); }
.file:first-of-type { border-top: 0; }
.file summary { display: flex; gap: 10px; align-items: baseline; padding: 10px 0; cursor: pointer; list-style: none; flex-wrap: wrap; }
.file summary::-webkit-details-marker { display: none; }
.path { font-family: var(--mono); font-size: 13px; }
.badge { font-size: 11px; border-radius: 6px; padding: 1px 8px; background: var(--chip); }
.badge.create { background: var(--add); color: var(--add-text); }
.badge.update { background: var(--accent-soft); color: var(--accent); }
.counts { font-family: var(--mono); font-size: 12px; }
.counts .a { color: var(--add-text); } .counts .d { color: var(--del-text); }
.note { color: var(--muted); font-size: 13px; }
pre { margin: 0 0 12px; padding: 12px 0; background: var(--bg); border-radius: 8px; overflow-x: auto; font: 12px/1.55 var(--mono); }
pre span { display: block; padding: 0 12px; white-space: pre; }
pre .a { background: var(--add); color: var(--add-text); }
pre .d { background: var(--del); color: var(--del-text); }
pre .h { color: var(--muted); }
.cmd { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
.scroll { overflow-x: auto; }
.cmd code { flex: 1; min-width: 0; font: 13px var(--mono); background: var(--bg); padding: 8px 10px; border-radius: 8px; overflow-x: auto; white-space: nowrap; }
.cmd button { border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 8px; padding: 6px 10px; cursor: pointer; font: inherit; font-size: 13px; }
.label { font-size: 13px; color: var(--muted); margin: 12px 0 6px; }
.conflict { border-top: 1px solid var(--line); padding: 12px 0; }
.conflict:first-of-type { border-top: 0; }
.conflict h3 { font-size: 15px; margin: 0 0 4px; display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; }
.badge.clash { background: var(--warn); color: var(--warn-text); }
.badge.together { background: var(--add); color: var(--add-text); }
.items { list-style: none; margin: 6px 0 0; padding: 0; }
.items li { padding: 3px 0; display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; }
.items .who { font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; }
.items .what { color: var(--muted); font-size: 13px; flex: 1 1 260px; min-width: 0; overflow-wrap: anywhere; }
.items label { font-size: 13px; white-space: nowrap; }
.label:first-child { margin-top: 0; }
@media (max-width: 720px) { .hide-sm { display: none; } td, th { padding: 8px 4px; } .chip { white-space: normal; } }
</style>
</head>
<body>
<main id="app"></main>
<script>
const REPORT = /*__REPORT__*/null;
// The strings in the user's language, from scripts/i18n/en.json and the translation in the data folder.
const L = /*__STRINGS__*/null;
const t = L.strings;
document.title = t.title;
const state = {
  level: REPORT.selection.level,
  techs: new Set(REPORT.selection.techs),
  modules: new Set(),
  without: new Set(REPORT.selection.without ?? []),
};
const fill = (text, values = {}) => String(text).replace(/\{(\w+)\}/g, (_, key) => values?.[key] ?? '');
const esc = (text) => String(text ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const chip = (source) => {
  if (source.kind === 'pack') return `<span class="chip pack" title="${esc(source.description)}">${esc(source.label)} <span class="tag">${t.planned}</span></span>`;
  if (source.kind === 'plugin') return `<span class="chip">${esc(source.label)} <span class="tag">${t.on}</span></span>`;
  if (source.kind === 'docs') return `<span class="chip">context7${source.enabled ? '' : ` <span class="tag">${t.docsOff}</span>`}</span>`;
  return `<span class="chip" title="${esc(source.description)}">${esc(source.label)} <span class="tag">${t.toWrite}</span></span>`;
};

const diffHtml = (diff) => diff.split('\n').filter((line, i, all) => i < all.length - 1 || line).map((line) => {
  const cls = line.startsWith('+++') || line.startsWith('---') || line.startsWith('@@') ? 'h' : line.startsWith('+') ? 'a' : line.startsWith('-') ? 'd' : '';
  return `<span class="${cls}">${esc(line) || ' '}</span>`;
}).join('');

const commands = () => {
  const all = REPORT.techs.map((tech) => tech.id);
  const picked = all.filter((id) => state.techs.has(id));
  const techArg = picked.length === all.length ? '' : ` --techs ${picked.join(',')}`;
  const moduleArg = state.modules.size ? ` --modules ${[...state.modules].join(',')}` : '';
  const withoutArg = state.without.size ? ` --without ${[...state.without].map((id) => id.replace(/^hecpack:/, '')).join(',')}` : '';
  const rerun = `/hecpack:preview --level ${state.level}${techArg}${withoutArg}`;
  return { rerun, tryit: `${rerun} --try`, init: `/hecpack:init --level ${state.level}${techArg}${moduleArg}${withoutArg}` };
};

const cmd = (text) => `<div class="cmd"><code>${esc(text)}</code><button data-copy="${esc(text)}">${t.copy}</button></div>`;

const OPTIONAL = ['designer', 'e2e-runner'];
const plural = new Intl.PluralRules(L.lang);
const count = (forms, n) => fill(forms[plural.select(n)] ?? forms.other, { n: n.toLocaleString(L.lang) });
const counts = (byType) => Object.entries(byType ?? {}).map(([type, n]) => (t.count[type] ? count(t.count[type], n) : `${n} ${type}`)).join(' · ');

const conflictHtml = (conflict) => {
  const title = fill(t.titles[conflict.kind], { role: t.roles[conflict.role] ?? conflict.role, event: conflict.event, name: conflict.name });
  const named = conflict.kind === 'name' && conflict.withHecpack ? [conflict.name.replace(/^agent:/, '')] : conflict.sameName ?? [];
  const hint = [conflict.kind === 'name' && conflict.withHecpack ? '' : t.hints[`${conflict.kind}-${conflict.severity}`], ...named.map((name) => fill(t.hints['name-hecpack'], { name }))].filter(Boolean).join(' ');
  const item = (it) => {
    const optional = it.source === 'hecpack' && it.type === 'agent' && OPTIONAL.includes(it.name);
    const id = `hecpack:${it.name}`;
    const box = optional ? `<label><input type="checkbox" data-without="${esc(id)}" ${state.without.has(id) ? 'checked' : ''}> ${t.leaveOut}</label>` : '';
    return `<li class="${optional && state.without.has(id) ? 'off' : ''}"><span class="who">${esc(it.source)} · ${esc(t.types[it.type] ?? it.type)} · <b>${esc(it.name)}</b></span><span class="what">${esc(it.description)}</span>${it.usedBy ? `<span class="tag">${esc(fill(t.usedBy, { agent: it.usedBy }))}</span>` : ''}${box}</li>`;
  };
  return `<div class="conflict">
    <h3><span class="badge ${conflict.severity}">${t[conflict.severity]}</span>${esc(title)}${conflict.withHecpack ? ` <span class="tag">${t.withHecpack}</span>` : ''}</h3>
    <div class="note">${esc(hint ?? '')}</div>
    <ul class="items">${conflict.items.map(item).join('')}</ul>
  </div>`;
};

const auditHtml = (audit) => {
  if (!audit) return '';
  const local = ['user', 'project'].map((who) => (counts(audit.local?.[who]) ? `${t[who]}: ${counts(audit.local[who])}` : '')).filter(Boolean);
  return `<section>
    <h2>${t.installed}</h2>
    <p class="note">${t.installedNote}</p>
    ${audit.plugins.length ? `<div class="label">${t.plugins}</div><div class="chips">${audit.plugins.map((p) => `<span class="chip ${p.enabled ? '' : 'off'}" title="${esc(p.description)}">${esc(p.name)} <span class="tag">${p.enabled ? esc(counts(p.counts)) : t.off}</span></span>`).join('')}</div>` : ''}
    ${local.length ? `<div class="label">${t.yours}</div><div class="note">${local.map(esc).join('; ')}</div>` : ''}
    <div class="label"></div>
    ${audit.conflicts.length ? audit.conflicts.map(conflictHtml).join('') : `<p class="note">${t.noConflicts}</p>`}
  </section>`;
};

const render = () => {
  const level = REPORT.levels[state.level];
  const c = commands();
  const claude = REPORT.claude;
  const existing = [
    ...claude.claudeMd, ...claude.agents.map((a) => `agent ${a}`), ...claude.skills.map((s) => `skill ${s}`),
    ...claude.hookEvents.map((h) => `hook ${h}`), ...claude.mcp.map((m) => `mcp ${m}`),
  ];
  document.getElementById('app').innerHTML = `
    <header>
      <div>
        <h1>${esc(REPORT.project.name)}<small>${esc(fill(t.subtitle, { version: REPORT.hecpack }))}</small></h1>
        <div class="sub">${t.nothing}</div>
      </div>
      <div class="levels" role="radiogroup" aria-label="${t.level}">
        ${['lite', 'standard', 'deep'].map((id) => `<button role="radio" aria-checked="${id === state.level}" class="${id === state.level ? 'on' : ''}" data-level="${id}">${t[id]}${id === REPORT.recommended?.level ? ` <span class="tag">${t.recommended}</span>` : ''}</button>`).join('')}
      </div>
    </header>
    ${REPORT.warnings.length ? `<section><h2>${t.warnings}</h2>${REPORT.warnings.map((w) => `<p class="warn">${esc(t.warn[w.id] ? fill(t.warn[w.id], w.values) : w.text)}</p>`).join('')}
      ${existing.length ? `<div class="label">${t.existing}</div><div class="chips">${existing.map((e) => `<span class="chip">${esc(e)}</span>`).join('')}</div>` : ''}</section>` : ''}
    <section>
      <h2>${t.techs}</h2>
      <div class="scroll"><table>
        <tr><th></th><th>${t.tech}</th><th class="hide-sm">${t.found}</th><th>${t.sources}</th></tr>
        ${REPORT.techs.map((tech) => `
          <tr class="${state.techs.has(tech.id) ? '' : 'off'}">
            <td><input type="checkbox" data-tech="${esc(tech.id)}" ${state.techs.has(tech.id) ? 'checked' : ''} aria-label="${esc(tech.label)}"></td>
            <td><div class="tech">${esc(tech.label)}</div><div class="ver">${esc(tech.version ?? '')} <span class="kind">${esc(t.kinds[tech.kind] ?? tech.kind)}</span></div></td>
            <td class="evidence hide-sm">${tech.evidence.map(esc).join('<br>')}</td>
            <td><div class="chips">${tech.sources.map(chip).join('')}</div></td>
          </tr>`).join('')}
      </table></div>
    </section>
    ${REPORT.docs?.length ? `<section>
      <h2>${t.docs}</h2>
      <p class="note">${t.docsNote}</p>
      <div class="scroll"><table>
        ${REPORT.docs.map((doc) => `<tr><td><span class="path">${esc(doc.path)}</span> <span class="tag">${esc(t.docKinds[doc.kind] ?? doc.kind)}, ${esc(count(t.lines, doc.lines))}</span></td>
          <td class="note">${doc.headings.slice(0, 6).map(esc).join(' · ')}</td>
          <td><div class="chips">${doc.topics.map((topic) => `<span class="chip">${esc(t.topicNames[topic] ?? topic)}</span>`).join('')}</div></td></tr>`).join('')}
      </table></div>
    </section>` : ''}
    ${auditHtml(REPORT.audit)}
    <section>
      <h2>${t.validation}</h2>
      ${REPORT.validation.length ? REPORT.validation.map((v) => cmd(v.command)).join('') : `<p class="note">${t.none}</p>`}
    </section>
    <section>
      <h2>${t.files}</h2>
      <p class="levelinfo">${esc(t.info[state.level] ?? level.info)}<br><span class="tag">${esc(fill(t.agents, { list: (level.agents ?? []).filter((agent) => !state.without.has(agent)).join(', ') }))}</span></p>
      ${level.files.filter((file) => !file.module || state.modules.has(file.module)).map((file) => `
        <details class="file">
          <summary><span class="badge ${file.action}">${t[file.action]}</span><span class="path">${esc(file.path)}</span>${file.module ? `<span class="tag">${t.optional}: ${esc(file.module)}</span>` : ''}
            <span class="counts"><span class="a">+${file.added}</span> <span class="d">-${file.removed}</span></span><span class="note">${esc(t.notes[file.id] ?? file.note)}</span></summary>
          <pre>${diffHtml(file.diff)}</pre>
        </details>`).join('')}
    </section>
    ${Object.keys(REPORT.modules ?? {}).length ? `<section>
      <h2>${t.modules}</h2>
      <div class="chips">${Object.entries(REPORT.modules).map(([id, m]) => `<label class="chip" title="${esc(m.description)}"><input type="checkbox" data-module="${esc(id)}" ${state.modules.has(id) ? 'checked' : ''}>${esc(m.label)}</label>`).join('')}</div>
    </section>` : ''}
    <section>
      <h2>${t.commands}</h2>
      <div class="label">${t.initLabel}</div>${cmd(c.init)}
      <div class="label">${t.rerun}</div>${cmd(c.rerun)}
      <div class="label">${t.tryit}</div>${cmd(c.tryit)}
    </section>`;
};

document.addEventListener('click', (event) => {
  const level = event.target.closest('[data-level]');
  if (level) { state.level = level.dataset.level; render(); return; }
  const copy = event.target.closest('[data-copy]');
  if (copy) {
    navigator.clipboard?.writeText(copy.dataset.copy).then(() => { copy.textContent = t.copied; setTimeout(() => { copy.textContent = t.copy; }, 1200); });
  }
});
document.addEventListener('change', (event) => {
  const { tech, module, without } = event.target.dataset;
  const set = tech ? state.techs : module ? state.modules : without ? state.without : null;
  if (!set) return;
  const id = tech ?? module ?? without;
  if (event.target.checked) set.add(id); else set.delete(id);
  render();
});
render();
</script>
</body>
</html>
